<div class="shell" [class.shell--nav-open]="shell.navOpen()">
  <button type="button" class="shell-backdrop" aria-label="Close navigation" (click)="shell.closeNav()"></button>

  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <app-brand-logo size="sm" [interactive]="true" />
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a class="nav-item" [routerLink]="item.route" routerLinkActive="active" (click)="shell.closeNav()">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-user">
      <div class="user-chip">
        <span class="user-avatar">{{ userInitial }}</span>
        <div class="user-meta">
          <strong>{{ userName }}</strong>
          <span>Product Owner</span>
        </div>
      </div>
    </div>

    <button type="button" class="logout-btn" (click)="authService.logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </button>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-row topbar-left">
        <button type="button" class="menu-toggle" aria-label="Open navigation menu" (click)="shell.toggleNav()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div>
          <p class="topbar-label">Product Owner Portal</p>
          <h2 class="topbar-title">Premisus 360</h2>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip user-chip--compact">
          <span class="user-avatar">{{ userInitial }}</span>
          <div class="user-meta">
            <strong>{{ userName }}</strong>
            <span>Product Owner</span>
          </div>
        </div>
        <app-theme-toggle />
      </div>
    </header>

    <div class="page-content">
      <router-outlet />
    </div>
  </main>
</div>
