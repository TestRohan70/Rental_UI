<div class="shell" [class.shell--nav-open]="shell.navOpen()">
  <button type="button" class="shell-backdrop" aria-label="Close navigation" (click)="shell.closeNav()"></button>

  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <app-brand-logo size="sm" [interactive]="true" />
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/security/gate" routerLinkActive="active" (click)="shell.closeNav()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </span>
        Gate Portal
      </a>
      <a class="nav-item" routerLink="/security/generate-alert" routerLinkActive="active" (click)="shell.closeNav()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </span>
        Generate Alert
      </a>
    </nav>

    <button class="logout-btn" (click)="authService.logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </button>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-row topbar-left">
        <button type="button" class="menu-toggle" aria-label="Open navigation menu" (click)="shell.toggleNav()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div>
          <p class="topbar-label">Security Gate Portal</p>
          <h2 class="topbar-title">Society Gate Operations</h2>
          @if (securityName) {
            <p class="topbar-user">On duty: {{ securityName }}</p>
          }
        </div>
      </div>
      <div class="topbar-actions">
        <app-theme-toggle />
        <button
          type="button"
          class="notification-bell"
          (click)="openNotifications()"
          [class.has-pending]="notificationService.unreadCount() > 0"
          aria-label="Security notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          @if (notificationService.unreadCount() > 0) {
            <span class="bell-badge">{{ notificationService.unreadCount() }}</span>
          }
        </button>
      </div>
    </header>

    <div class="page-content">
      <router-outlet />
    </div>
  </main>
</div>

@if (showSecurityPopup() && latestAlert(); as alert) {
  <div class="modal-backdrop" (click)="closePopup()" role="presentation">
    <div class="modal-card" role="dialog" aria-labelledby="security-alert-title" (click)="$event.stopPropagation()">
      <button type="button" class="modal-close" (click)="closePopup()" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="modal-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </div>

      <h2 id="security-alert-title" class="modal-title">{{ alert.title }}</h2>
      <p class="modal-subtitle">{{ alert.message }}</p>

      @if (alert.title.includes('Approved')) {
        <button type="button" class="approve-btn" style="width: 100%; margin-bottom: 12px;" (click)="goToGate()">
          Go to Gate Portal & Check In
        </button>
      }

      <button type="button" class="modal-dismiss" (click)="closePopup()">Dismiss Alert</button>
    </div>
  </div>
}
