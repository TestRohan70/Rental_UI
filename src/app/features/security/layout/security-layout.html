<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <app-brand-logo size="sm" [interactive]="true" />
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/security/gate" routerLinkActive="active">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </span>
        Gate Portal
      </a>
      <a class="nav-item" routerLink="/security/generate-alert" routerLinkActive="active">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </span>
        Generate Alert
      </a>
    </nav>

    <button class="logout-btn" (click)="authService.logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </button>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <p class="topbar-label">Secretary Portal</p>
        <h2 class="topbar-title">Society Security Management</h2>
        @if (securityName) {
          <p class="topbar-user">On duty: {{ securityName }}</p>
        }
      </div>
      <div class="topbar-actions">
        <app-theme-toggle />
      </div>
    </header>

    <div class="page-content">
      <router-outlet />
    </div>
  </main>
</div>
